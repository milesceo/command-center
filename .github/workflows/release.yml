name: Release

# A version tag builds the Windows installer and the macOS dmg, smoke-tests each installed layout and
# publishes the release with the matching CHANGELOG section as its notes (the Windows job creates
# the release; the macOS dmg is attached to it afterwards). Pull requests that touch packaging and
# manual runs do the same builds and checks but publish nothing (the files are kept as artifacts).
# The macOS app is unsigned (ad-hoc signed inside); see docs/macos.md for Developer ID signing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Changes to packaging build and smoke-test the installer too (nothing is published).
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - apps/desktop/src-tauri/**
      - packages/bridge/**
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Only the tag build compares tag and manifests; a manual run uses the manifests as they are.
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Check the tag matches every manifest
        if: env.IS_TAG == 'true'
        shell: bash
        run: node scripts/release-tools.mjs check-version "$GITHUB_REF_NAME"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # beforeBuildCommand bundles the bridge, copies node.exe and the SDK's claude.exe, then
      # builds the frontend; `tauri build` compiles the app and packages the NSIS installer.
      - name: Releases are never lite builds
        if: env.COMMAND_CENTER_LITE != ''
        shell: bash
        run: echo 'COMMAND_CENTER_LITE must not be set for a release build' && exit 1

      - name: Build the installer
        run: pnpm --filter @command-center/desktop tauri build --bundles nsis

      - name: Locate the installer
        id: installer
        shell: bash
        run: |
          file=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          # The product name has a space; GitHub would rename the asset (space -> dot) and the
          # checksum file would no longer match it, so publish a space-free name.
          renamed="$(dirname "$file")/$(basename "$file" | tr ' ' '-')"
          if [ "$file" != "$renamed" ]; then mv "$file" "$renamed"; file="$renamed"; fi
          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"
          ls -l "$file"

      - name: Install it silently, like a user would (per-user, no admin)
        shell: pwsh
        run: |
          $installer = (Resolve-Path "${{ steps.installer.outputs.path }}").Path
          $target = Join-Path $env:RUNNER_TEMP 'Command Center'
          # /D must be the last argument and must not be quoted.
          $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          Get-ChildItem $target -Recurse -File | Where-Object { $_.Length -gt 1MB } |
            Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          "INSTALL_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test the installed files (bundled Node starts the bundled bridge and runtime)
        run: node scripts/smoke-installed.mjs "$env:INSTALL_DIR"

      - name: Launch the installed app and check it starts its bridge
        shell: pwsh
        run: |
          $app = Join-Path $env:INSTALL_DIR 'command-center.exe'
          if (-not (Test-Path $app)) { throw "command-center.exe is not in $env:INSTALL_DIR" }
          $out = Join-Path $env:RUNNER_TEMP 'app.out.log'
          $err = Join-Path $env:RUNNER_TEMP 'app.err.log'
          $proc = Start-Process -FilePath $app -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          function Show-State {
            Write-Host '--- processes started by the app (any depth) ---'
            $all = Get-CimInstance Win32_Process
            $ids = @($proc.Id)
            do {
              $kids = $all | Where-Object { $ids -contains $_.ParentProcessId -and $ids -notcontains $_.ProcessId }
              $ids += @($kids | ForEach-Object { $_.ProcessId })
            } while ($kids)
            $all | Where-Object { $ids -contains $_.ProcessId } |
              ForEach-Object { Write-Host "$($_.ProcessId) <- $($_.ParentProcessId)  $($_.Name)  $($_.CommandLine)" }
            Write-Host '--- stdout ---'; if (Test-Path $out) { Get-Content $out -Tail 40 }
            Write-Host '--- stderr ---'; if (Test-Path $err) { Get-Content $err -Tail 40 }
          }
          # The app starts its bridge when its window loads; wait for the bundled node to appear as its child.
          $bridge = $null
          for ($i = 0; $i -lt 60 -and -not $bridge; $i++) {
            Start-Sleep -Milliseconds 500
            if ($proc.HasExited) { Show-State; throw "command-center.exe exited early with code $($proc.ExitCode)" }
            $bridge = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($proc.Id) AND Name = 'node.exe'"
          }
          if (-not $bridge) { Show-State; throw 'the app never started its bridge' }
          Write-Host "bridge: $($bridge.CommandLine)"
          if ($bridge.CommandLine -notlike "*$env:INSTALL_DIR*main.mjs*") { Show-State; throw 'the bridge is not the bundled one' }
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { Show-State; throw "command-center.exe crashed with code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force

      - name: Checksum
        shell: bash
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/nsis
          sha256sum *-setup.exe | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the release
        if: env.IS_TAG == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-tools.mjs notes "$GITHUB_REF_NAME" > release-notes.md
          cd apps/desktop/src-tauri/target/release/bundle/nsis
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Command Center ${GITHUB_REF_NAME#v}" \
            --notes-file "$GITHUB_WORKSPACE/release-notes.md" \
            --verify-tag \
            ./*-setup.exe ./SHA256SUMS.txt

  macos:
    name: macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile

      # beforeBuildCommand bundles the bridge and copies (and ad-hoc signs) node and claude; the
      # app is built for Apple Silicon (the runner's architecture) and packed into a dmg.
      - name: Releases are never lite builds
        if: env.COMMAND_CENTER_LITE != ''
        run: echo 'COMMAND_CENTER_LITE must not be set for a release build' && exit 1

      - name: Build the app and dmg
        run: pnpm --filter @command-center/desktop tauri build --bundles app,dmg

      - name: Locate the dmg
        id: dmg
        run: |
          file=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          # Space-free asset name (GitHub renames spaces in assets, which breaks the checksum file).
          renamed="$(dirname "$file")/$(basename "$file" | tr ' ' '-')"
          if [ "$file" != "$renamed" ]; then mv "$file" "$renamed"; file="$renamed"; fi
          echo "path=$file" >> "$GITHUB_OUTPUT"
          ls -l "$file"

      - name: Install from the dmg, like a user would
        run: |
          mount=$(mktemp -d)
          hdiutil attach "${{ steps.dmg.outputs.path }}" -nobrowse -readonly -mountpoint "$mount"
          app=$(ls -d "$mount"/*.app | head -n 1)
          target="$RUNNER_TEMP/Applications"
          mkdir -p "$target"
          cp -R "$app" "$target/"
          hdiutil detach "$mount"
          echo "APP=$target/$(basename "$app")" >> "$GITHUB_ENV"
          du -sh "$target"/*.app

      - name: Smoke test the installed app (bundled Node starts the bundled bridge and runtime)
        run: node scripts/smoke-installed.mjs "$APP"

      - name: Launch the installed app and check it starts its bridge
        run: |
          exe="$APP/Contents/MacOS/command-center"
          test -x "$exe" || { echo "command-center is not in $APP/Contents/MacOS"; exit 1; }
          "$exe" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          bridge=""
          for i in $(seq 1 60); do
            sleep 0.5
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/app.log"; echo "the app exited early"; exit 1; }
            bridge=$(pgrep -P "$pid" -fl node || true)
            [ -n "$bridge" ] && break
          done
          [ -n "$bridge" ] || { cat "$RUNNER_TEMP/app.log"; echo "the app never started its bridge"; exit 1; }
          echo "bridge: $bridge"
          case "$bridge" in *"$APP"*main.mjs*) ;; *) echo "the bridge is not the bundled one"; exit 1;; esac
          sleep 5
          kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/app.log"; echo "the app crashed"; exit 1; }
          kill "$pid"

      - name: Checksum
        run: |
          cd "$(dirname "${{ steps.dmg.outputs.path }}")"
          shasum -a 256 *.dmg | tee SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/dmg/SHA256SUMS-macos.txt
          if-no-files-found: error

  publish-macos:
    name: Attach the macOS dmg to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dmg
      - name: Upload to the release the Windows job created
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dmg/*.dmg dmg/SHA256SUMS-macos.txt
