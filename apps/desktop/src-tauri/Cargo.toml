[package]
name = "programish"
version = "0.1.0"
description = "Programish desktop app"
authors = ["engineerlish"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "programish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
