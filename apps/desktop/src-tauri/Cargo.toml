[package]
name = "command-center"
version = "1.0.0"
description = "Command Center desktop app"
authors = ["milesceo"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Same features as the dialog plugin enables, for the one blocking message box shown before any
# window exists (`migrate_previous_data`).
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tauri-plugin-autostart = "2"
